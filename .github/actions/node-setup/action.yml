name: Node Setup

description: Setup Node.js and install dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "26"

runs:
  using: "composite"

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
